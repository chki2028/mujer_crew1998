<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUJER CREW 1998 | THE ARCHIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #030303; color: #e5e5e5; }
    .font-serif { font-family: 'Cinzel', serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .glass-panel { background: rgba(25, 25, 25, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gold-gradient-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="antialiased selection:bg-[#bf953f] selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 이미지가 없을 때 우아하게 처리하는 컴포넌트
    const PremiumImage = ({ src, alt, className }) => {
      const [hasError, setHasError] = useState(false);
      if (hasError) {
        return (
          <div className={`flex flex-col items-center justify-center bg-[#0a0a0a] border border-white/10 p-6 text-center ${className}`}>
            <span className="text-gray-600 text-[10px] tracking-widest font-light uppercase">Asset Offline: {alt}</span>
          </div>
        );
      }
      return (
        <img 
          src={src} 
          alt={alt} 
          className={`object-cover transition-transform duration-700 hover:scale-105 ${className}`}
          onError={() => setHasError(true)}
        />
      );
    };

    function App() {
      const [currentTrack, setCurrentTrack] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [lyricIndex, setLyricIndex] = useState(0);

      const tracks = [
        {
          title: "MUJER'S CALL",
          videoSrc: "KakaoTalk_Video_2026-05-13-14-33-07-3.mp4",
          lyrics: ["나가자 무저크루의 븅순들과", "모두 보들들 어깨마다 걸치고", "무저가 언제 어디로 가더라도", "우리는 욕해 보스턴 보들쓰리", "무저가 부를때"]
        },
        {
          title: "WINGS OF YEOMBYEONG",
          videoSrc: "KakaoTalk_Video_2026-05-13-14-33-07-2.mp4",
          lyrics: ["돈까스팔러 어디라도 따라", "염병따라 네지랄을 담아", "날아가 무저년 저 보들끝까지", "섬진강 염병의 날개로", "campeon", "synapses", "bottlethree", "docbond"]
        }
      ];

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setLyricIndex((prev) => (prev < tracks[currentTrack].lyrics.length - 1 ? prev + 1 : prev));
          }, 2500);
        }
        return () => clearInterval(interval);
      }, [isPlaying, currentTrack]);

      useEffect(() => { setLyricIndex(0); }, [currentTrack]);

      const members = [
        { name: "ODONGHYOP", title: "Gastronomic Director", tags: ["Ddakgalbi", "Yugane", "Seomjin River"], description: "무저크루의 미식 파트를 담당하며 K-전통 퍼레이드 등 크루의 정체성 확장을 이끌고 있습니다." },
        { name: "MUJER", title: "Chief Visionary Officer", tags: ["Fimo", "Communication", "Global Marketer"], description: "글로벌 마케팅 전략과 IP 콜라보레이션을 통해 무저크루의 비전을 현실화합니다." },
        { name: "CHIGGAHWAN", title: "Entertainment", tags: ["Unpredictable", "Football Fan"], description: "자유로운 예술적 영감을 바탕으로 크루 내 예기치 못한 즐거움을 창조합니다." },
        { name: "KIGPARK", title: "Aesthetic Specialist", tags: ["Codio", "K-Beauty", "Artisan"], description: "미학적 완성도를 추구하며 K-뷰티 메이크업 분야의 새로운 기준을 제시합니다." },
      ];

      return (
        <div className="min-h-screen">
          <nav className="fixed w-full z-50 glass-panel py-4 px-8 flex justify-between items-center">
            <h1 className="text-2xl font-serif tracking-[0.2em] gold-gradient-text">MUJER 1998</h1>
            <div className="hidden md:flex gap-8 text-sm tracking-widest font-light">
              <a href="#about" className="hover:text-[#bf953f]">ABOUT</a>
              <a href="#members" className="hover:text-[#bf953f]">PIONEERS</a>
              <a href="#anthem" className="hover:text-[#bf953f]">ANTHEM</a>
              <a href="#archive" className="hover:text-[#bf953f]">ARCHIVE</a>
            </div>
          </nav>

          <section id="about" className="relative min-h-screen flex items-center justify-center px-4 pt-20 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#1a1a1a] via-[#050505] to-[#000000] -z-10"></div>
            <div className="text-center max-w-4xl mx-auto animate-fade-in">
              <span className="block text-sm tracking-[0.3em] text-[#bf953f] mb-6 uppercase">Established in 1998</span>
              <h2 className="text-5xl md:text-7xl lg:text-8xl font-serif mb-8 leading-tight tracking-wider">BEYOND <br /><span className="gold-gradient-text">THE ORDINARY</span></h2>
              <p className="text-lg md:text-xl font-light text-gray-400 leading-relaxed max-w-2xl mx-auto tracking-wide">우리는 시대의 흐름을 정의하고 새로운 문화를 창조합니다. MUJER CREW의 공식 아카이브입니다.</p>
            </div>
          </section>

          <section id="anthem" className="py-32 px-4 bg-[#0a0a0a]">
            <div className="max-w-7xl mx-auto">
              <div className="glass-panel rounded-2xl flex flex-col lg:flex-row overflow-hidden shadow-2xl">
                <div className="flex-1 bg-black p-4 md:p-8 flex flex-col gap-6">
                  <div className="flex gap-4">
                    {tracks.map((track, idx) => (
                      <button key={idx} onClick={() => setCurrentTrack(idx)} className={`pb-2 text-sm tracking-widest transition-all ${currentTrack === idx ? 'text-[#bf953f] border-b-2 border-[#bf953f]' : 'text-gray-500'}`}>{track.title}</button>
                    ))}
                  </div>
                  <div className="relative aspect-video rounded-xl overflow-hidden bg-[#050505] border border-white/5">
                    <video key={tracks[currentTrack].videoSrc} src={tracks[currentTrack].videoSrc} controls className="w-full h-full object-contain"></video>
                  </div>
                </div>
                <div className="lg:w-1/3 bg-[#111] p-8 md:p-12 flex flex-col justify-center text-center">
                  <div className="space-y-6">
                    {tracks[currentTrack].lyrics.map((line, idx) => (
                      <p key={idx} className={`transition-all duration-700 font-light tracking-wide ${lyricIndex === idx && isPlaying ? 'text-xl text-white transform scale-105' : 'text-sm text-gray-600'}`}>{line}</p>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="archive" className="py-32 px-4">
            <div className="max-w-7xl mx-auto">
              <h2 className="text-center font-serif text-4xl tracking-widest mb-20 gold-gradient-text">THE ARCHIVE</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-15.png" alt="Legacy" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-14.png" alt="Marketing" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-17.png" alt="Factory" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-19.jpg" alt="Splatoon" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-18.jpg" alt="Zelda" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-square bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-20.jpg" alt="Legend" className="w-full h-full" /></div>
                <div className="group relative overflow-hidden rounded-xl aspect-[2/1] md:col-span-2 lg:col-span-3 bg-[#0a0a0a]"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-16.jpeg" alt="K-Beauty" className="w-full h-full object-contain bg-[#050505]" /></div>
              </div>
            </div>
          </section>

          <footer className="py-12 border-t border-white/5 text-center text-[10px] text-gray-700 tracking-[0.4em] uppercase">
            © 2026 MUJER CREW. All rights reserved.
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
