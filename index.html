<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUJER CREW 1998 | THE ARCHIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #030303; color: #e5e5e5; }
    .font-serif { font-family: 'Cinzel', serif; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .glass-panel { background: rgba(25, 25, 25, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="antialiased selection:bg-[#bf953f] selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PremiumImage = ({ src, alt, className }) => {
      const [hasError, setHasError] = useState(false);
      if (hasError) {
        return (
          <div className={`flex flex-col items-center justify-center bg-[#0a0a0a] border border-white/5 p-6 text-center ${className}`}>
            <span className="text-gray-600 text-[10px] tracking-widest uppercase">Asset Offline</span>
          </div>
        );
      }
      return (
        <img 
          src={src} 
          alt={alt} 
          className={`object-cover transition-transform duration-1000 hover:scale-110 ${className}`}
          onError={() => setHasError(true)}
        />
      );
    };

    function App() {
      const [currentTrack, setCurrentTrack] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [lyricIndex, setLyricIndex] = useState(0);

      const tracks = [
        {
          title: "MUJER'S CALL",
          videoSrc: "KakaoTalk_Video_2026-05-13-14-33-07-3.mp4",
          lyrics: ["나가자 무저크루의 븅순들과", "모두 보들들 어깨마다 걸치고", "무저가 언제 어디로 가더라도", "우리는 욕해 보스턴 보들쓰리", "무저가 부를때"]
        },
        {
          title: "WINGS OF YEOMBYEONG",
          videoSrc: "KakaoTalk_Video_2026-05-13-14-33-07-2.mp4",
          lyrics: ["돈까스팔러 어디라도 따라", "염병따라 네지랄을 담아", "날아가 무저년 저 보들끝까지", "섬진강 염병의 날개로", "campeon", "synapses", "bottlethree", "docbond"]
        }
      ];

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setLyricIndex((prev) => (prev < tracks[currentTrack].lyrics.length - 1 ? prev + 1 : prev));
          }, 2500);
        }
        return () => clearInterval(interval);
      }, [isPlaying, currentTrack]);

      useEffect(() => { setLyricIndex(0); }, [currentTrack]);

      const pioneers = [
        { name: "ODONGHYOP", role: "Gastronomic Director", desc: "무저크루의 전통과 미학을 담당하며, K-국악 퍼레이드를 통해 크루의 예술적 지평을 넓히고 있습니다." },
        { name: "MUJER", role: "Chief Visionary Officer", desc: "글로벌 마케팅 전략을 수립하고 다양한 IP 콜라보레이션을 통해 크루의 미래 비전을 제시합니다." },
        { name: "CHIGGAHWAN", role: "Chaos & Entertainment", desc: "고정관념을 깨는 자유로운 감각으로 크루 내 독창적인 엔터테인먼트 요소를 창조합니다." },
        { name: "KIGPARK", role: "Aesthetic Specialist", desc: "미학적 완성도에 집중하며, K-뷰티 분야에서 무저크루만의 독보적인 스타일을 구축합니다." }
      ];

      return (
        <div className="min-h-screen">
          <nav className="fixed w-full z-50 glass-panel py-6 px-10 flex justify-between items-center border-none">
            <h1 className="text-xl font-serif tracking-[0.5em] gold-text">MUJER 1998</h1>
            <div className="hidden md:flex gap-10 text-[10px] tracking-[0.3em] font-light text-gray-400">
              <a href="#about" className="hover:text-white transition-colors">ABOUT</a>
              <a href="#members" className="hover:text-white transition-colors">PIONEERS</a>
              <a href="#anthem" className="hover:text-white transition-colors">ANTHEM</a>
              <a href="#archive" className="hover:text-white transition-colors">ARCHIVE</a>
            </div>
          </nav>

          <section id="about" className="relative min-h-screen flex items-center justify-center px-4 pt-20 overflow-hidden bg-black">
            <div className="text-center max-w-4xl mx-auto animate-fade-in">
              <span className="block text-[10px] tracking-[0.4em] text-[#bf953f] mb-8 uppercase opacity-80">Established in 1998</span>
              <h2 className="text-5xl md:text-8xl font-serif mb-10 leading-tight tracking-widest">BEYOND <br /><span className="gold-text">THE ORDINARY</span></h2>
              <div className="w-12 h-px bg-[#bf953f] mx-auto mb-10 opacity-50"></div>
              <p className="text-sm md:text-base font-light text-gray-500 leading-relaxed max-w-2xl mx-auto tracking-[0.1em]">
                우리는 관습에 도전하며 새로운 문화적 연합을 정의합니다.<br/>MUJER CREW가 걸어온 기록과 예술적 여정을 확인해 보세요.
              </p>
            </div>
          </section>

          <section id="anthem" className="py-40 px-6 bg-[#050505]">
            <div className="max-w-6xl mx-auto">
              <div className="glass-panel rounded-3xl flex flex-col lg:flex-row overflow-hidden shadow-2xl border-white/5">
                <div className="flex-1 bg-black p-6 md:p-10 flex flex-col gap-8">
                  <div className="flex gap-6">
                    {tracks.map((track, idx) => (
                      <button key={idx} onClick={() => setCurrentTrack(idx)} className={`text-[10px] tracking-[0.3em] uppercase transition-all ${currentTrack === idx ? 'text-[#bf953f] border-b border-[#bf953f] pb-1' : 'text-gray-600 hover:text-gray-400'}`}>{track.title}</button>
                    ))}
                  </div>
                  <div className="relative aspect-video rounded-2xl overflow-hidden bg-[#020202] border border-white/5">
                    <video key={tracks[currentTrack].videoSrc} src={tracks[currentTrack].videoSrc} controls className="w-full h-full object-contain"></video>
                  </div>
                </div>
                <div className="lg:w-1/3 bg-[#080808] p-10 md:p-16 flex flex-col justify-center border-l border-white/5">
                  <div className="space-y-6 text-center">
                    {tracks[currentTrack].lyrics.map((line, idx) => (
                      <p key={idx} className={`transition-all duration-1000 font-light tracking-widest ${lyricIndex === idx && isPlaying ? 'text-lg text-white' : 'text-xs text-gray-700'}`}>{line}</p>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section id="members" className="py-40 px-6 max-w-7xl mx-auto">
            <h3 className="text-center font-serif text-3xl tracking-[0.5em] mb-32 gold-text uppercase">The Pioneers</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
              {pioneers.map((p, i) => (
                <div key={i} className="group glass-panel p-12 rounded-3xl hover:bg-white/[0.03] transition-all duration-500 border-white/5">
                  <h4 className="text-2xl font-serif tracking-[0.3em] mb-2 text-white group-hover:text-[#bf953f] transition-colors">{p.name}</h4>
                  <p className="text-[10px] tracking-[0.3em] text-[#bf953f] uppercase mb-8 font-medium">{p.role}</p>
                  <p className="text-sm font-light text-gray-500 leading-relaxed tracking-wide">{p.desc}</p>
                </div>
              ))}
            </div>
          </section>

          <section id="archive" className="py-40 px-6 bg-black border-t border-white/5">
            <div className="max-w-7xl mx-auto">
              <h3 className="text-center font-serif text-3xl tracking-[0.5em] mb-32 gold-text uppercase">The Archive</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {/* 📍 Finder 스크린샷 기반 확장자 자동 매칭 */}
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-15.png" alt="Legacy" className="w-full h-full" />
                </div>
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-14.png" alt="Discussion" className="w-full h-full" />
                </div>
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-17.png" alt="Factory" className="w-full h-full" />
                </div>
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-19.png" alt="Digital" className="w-full h-full" />
                </div>
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-18.png" alt="Expansion" className="w-full h-full" />
                </div>
                <div className="group relative overflow-hidden rounded-2xl aspect-square bg-[#050505] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-20.png" alt="Legend" className="w-full h-full" />
                </div>
                
                {/* 메인 뷰티 포스터 (16.jpeg) */}
                <div className="lg:col-span-3 aspect-[16/9] overflow-hidden rounded-2xl bg-[#020202] border border-white/5">
                  <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-16.jpeg" alt="Exhibition" className="w-full h-full object-contain" />
                </div>
              </div>
            </div>
          </section>

          <footer className="py-24 border-t border-white/5 text-center bg-[#030303]">
            <p className="text-[10px] text-gray-700 tracking-[0.6em] uppercase font-light">© 2026 MUJER CREW. ALL RIGHTS RESERVED.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
