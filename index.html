<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUJER CREW 1998 | THE ARCHIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #030303; color: #e5e5e5; }
    .font-serif { font-family: 'Cinzel', serif; }
    .glass-panel { background: rgba(25, 25, 25, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const PremiumImage = ({ src, alt }) => {
      const [hasError, setHasError] = useState(false);
      return hasError ? (
        <div className="w-full h-full flex items-center justify-center bg-[#0a0a0a] border border-white/5">
          <span className="text-gray-700 text-[10px] tracking-widest uppercase italic">Missing Asset: {alt}</span>
        </div>
      ) : (
        <img src={src} alt={alt} className="w-full h-full object-cover transition-transform duration-700 hover:scale-105" onError={() => setHasError(true)} />
      );
    };

    function App() {
      return (
        <div className="min-h-screen">
          <nav className="fixed w-full z-50 glass-panel py-5 px-8 text-center border-b border-white/5">
            <h1 className="text-xl font-serif tracking-[0.4em] gold-text">MUJER 1998</h1>
          </nav>
          
          <section className="pt-48 pb-20 text-center">
            <h2 className="text-5xl md:text-7xl font-serif mb-6 gold-text tracking-widest">THE ARCHIVE</h2>
            <div className="w-12 h-px bg-[#bf953f] mx-auto mb-6"></div>
            <p className="text-gray-500 tracking-[0.3em] uppercase text-[10px]">Visual Documentation of the Alliance</p>
          </section>

          <section className="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {/* Finder 목록과 파일명 100% 매칭 완료 */}
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-15.png" alt="Legacy" /></div>
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-14.png" alt="Strategy" /></div>
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-17.png" alt="Factory" /></div>
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-19.png" alt="Splatoon" /></div>
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-18.png" alt="Zelda" /></div>
            <div className="aspect-square overflow-hidden rounded-sm glass-panel"><PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-20.png" alt="MessivsRonaldo" /></div>
            
            {/* 메인 뷰티 포스터 (JPEG 확장자 주의) */}
            <div className="md:col-span-2 lg:col-span-3 aspect-[16/10] overflow-hidden rounded-sm glass-panel">
                <PremiumImage src="KakaoTalk_Photo_2026-05-13-14-33-07-16.jpeg" alt="K-Beauty Festival" />
            </div>
          </section>

          <footer className="py-20 text-center text-[9px] text-gray-700 tracking-[0.5em] uppercase border-t border-white/5">
            © 2026 MUJER CREW. DEFINING THE NEW STANDARD.
          </footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
